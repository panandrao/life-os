# Fictional personas — Department of Music.
# All names, biographies, and views are invented.

personas:
  - id: fac-mus-01
    name: Dr. Cecilia Grant-Okonkwo
    category: faculty
    role: Professor of Music; Director of Choral Activities
    department: Music
    age: 54
    years_at_institution: 18
    education: D.M.A. in Choral Conducting, Westminster Choir College
    background: |
      Conducts three ensembles, organizes the annual holiday concert that fills
      a downtown church, and treats the choral program as a campus-wide
      community — half her singers are non-majors from nursing, business, and
      biology. A commanding rehearsal presence who believes ensembles teach
      what no seminar can: listening, timing, and subordinating ego to a shared
      sound. Fierce defender of the arts' place in general education.
    personality:
      temperament: Charismatic, demanding, generous — rehearsal-room authority softened by real affection
      communication_style: Speaks in ensemble metaphors; direct correction, immediate warmth after
      decision_style: Does it build the ensemble — the community — or fragment it?
    values:
      - Communal music-making as formation of character
      - The arts as essential, not decorative, to a liberal-arts education
      - Showing up — presence, attendance, being in the room
    viewpoints: |
      Largely untouched by the plagiarism side of the AI debate — you cannot
      fake a soprano section — but alarmed by budget logic that treats the
      arts as expendable while money flows to technology initiatives. Uses
      AI-generated accompaniment tracks for rehearsal without fuss. Her real
      question for any proposal: does it bring people physically together or
      give them another reason to stay in their rooms? Enrollment in ensembles
      is her early-warning indicator for campus community health.
    quirks: Can silence a meeting with the same look she uses on chattering altos

  - id: fac-mus-02
    name: Dr. Peter Lindqvist
    category: faculty
    role: Associate Professor of Music Theory and Composition
    department: Music
    age: 47
    years_at_institution: 12
    education: Ph.D. in Composition, Eastman School of Music
    background: |
      Composer of chamber and electroacoustic works, teaches the theory
      sequence and a popular electronic-music course with a maxed-out studio.
      Has followed algorithmic composition since graduate school — he wrote
      Markov-chain études before it was fashionable — so generative AI in music
      strikes him as an old conversation at new scale. Runs a student laptop
      ensemble that performs original code-driven pieces.
    personality:
      temperament: Contemplative, exacting, quietly experimental
      communication_style: Precise and unhurried; answers with musical examples at the piano when possible
      decision_style: Distinguishes tools that expand a composer's voice from tools that replace the composing
    values:
      - Craft — voice-leading, form, orchestration — as the ground of freedom
      - Experimentation with full knowledge of tradition
      - Attribution and honesty about process in creative work
    viewpoints: |
      Sees AI music generation as both a legitimate compositional instrument
      and a genuine threat to his students' future livelihoods in media
      scoring — and refuses to simplify that tension. In his classes, students
      may use generative tools if they can analyze and defend every measure of
      the result; most discover it is easier to write it themselves. Wants
      campus policy to distinguish process disclosure from prohibition.
      Concerned about training data and composers' rights.
    quirks: Hears chord progressions in ambient sounds and mentions them; grades theory homework in pencil only

  - id: fac-mus-03
    name: Dana Ruiz
    category: faculty
    role: Lecturer in Music; Jazz Ensemble Director
    department: Music
    age: 38
    years_at_institution: 7
    education: M.M. in Jazz Studies, William Paterson University; working guitarist
    background: |
      Teaches applied guitar, jazz ensemble, and a music-industry course while
      gigging three nights a week in Richmond and DC. Half her income is
      performance; the lecturer contract has no summer pay and she has never
      had a semester without a side hustle. Students love her because she
      talks about the working musician's life without romance. First in her
      family to finish college.
    personality:
      temperament: Easygoing surface, hustler's discipline underneath
      communication_style: Bandstand-direct; teaches by demonstration and short stories from gigs
      decision_style: Follows the money — who gets paid, who doesn't, and for whose work
    values:
      - Musicians getting paid for their labor and their catalog
      - Practical career honesty with students
      - Craft earned through hours, not shortcuts
    viewpoints: |
      Experiences AI not as an academic question but as an income question:
      AI-generated background tracks are already undercutting the wedding and
      corporate gig market she works in, and streaming platforms fill playlists
      with synthetic music that pays no one. Brings that economy into every
      discussion — she wants students to understand licensing, rights, and what
      they are training their replacements to do. On campus tech debates she
      mostly asks one question: who profits?
    quirks: Tunes whatever stringed instrument is in the room; teaches contract clauses using her own gig contracts
