# Fictional personas — faculty from additional departments (Historic
# Preservation, English, Biology, Psychology, History, Mathematics, Business).
# All names, biographies, and views are invented.

personas:
  - id: fac-hpr-01
    name: Dr. Everett Shaw
    category: faculty
    role: Associate Professor of Historic Preservation
    department: Historic Preservation
    age: 49
    years_at_institution: 14
    education: Ph.D. in Architectural History, University of Virginia; M.S. in Historic Preservation
    background: |
      Teaches in one of the country's few undergraduate preservation programs —
      a point of institutional pride he invokes often. His students document
      historic buildings across the region with laser scanning, archival
      research, and community oral histories. Half advocate, half scholar: he
      has testified before town councils on demolition cases and treats the
      surrounding historic city as his laboratory.
    personality:
      temperament: Passionate, place-rooted, happiest on a job site with students
      communication_style: Narrates arguments through buildings and their people; long tangents that land
      decision_style: Preservation-minded — what is worth keeping, and what would we lose?
    values:
      - Stewardship of what previous generations built
      - Field skills and material literacy
      - The program's distinctiveness as the university's calling card
    viewpoints: |
      Comfortable with advanced documentation technology — his students fly
      drones and process point clouds — but wary of AI-generated historical
      narrative, where confident fabrication is professionally catastrophic; a
      hallucinated architect or date in a National Register nomination is his
      nightmare scenario. Wants explicit verification standards. Frames the
      larger AI question the way he frames buildings: adaptation and reuse
      beat both demolition and museum-freezing.
    quirks: Dates buildings from moving cars; carries a moisture meter "just in case"

  - id: fac-eng-01
    name: Dr. Maxine Little
    category: faculty
    role: Professor of English; Director of Creative Writing
    department: English and Linguistics
    age: 60
    years_at_institution: 26
    education: M.F.A. in Fiction, University of Virginia; two story collections and a novel
    background: |
      Has run the creative-writing program for two decades, edits the campus
      literary magazine with students, and brings visiting writers to campus on
      a shoestring. Her workshop is famous for exacting kindness — she will
      circle every false sentence and then tell you exactly why the true ones
      matter. Watched the discipline weather theory wars, MFA gluts, and the
      death of midlist publishing; considers AI the strangest chapter yet.
    personality:
      temperament: Wry, unhurried, morally serious under the humor
      communication_style: Precise about language because language is the whole game; quotes students' own sentences back to them
      decision_style: Judges by the sentence — does this help people write truer sentences or not?
    values:
      - Voice as the irreducible human signature
      - The workshop as a community of honest readers
      - Reading as the foundation nobody can skip
    viewpoints: |
      Not worried that machines will out-write her students; worried students
      will stop discovering what they think, which for her is what writing is.
      Finds AI prose "competent the way hotel art is competent" and uses that
      line often. Open to teaching *about* the technology — she runs one
      workshop day on machine text as a foil for voice. Opposes surveillance
      grading absolutely; she can hear her students' voices well enough to
      notice when one goes missing.
    quirks: Reads suspect passages aloud in a flat "robot voice" to make her point; writes marginalia in green ink

  - id: fac-eng-02
    name: Dr. Sam Whitaker
    category: faculty
    role: Assistant Professor of English (Digital Humanities)
    department: English and Linguistics
    pronouns: they/them
    age: 35
    years_at_institution: 3
    education: Ph.D. in English, Northeastern University; graduate certificate in digital humanities
    background: |
      Hired to bridge literature and computation: teaches text mining for
      literature students, an electronic-literature survey, and a general-education
      course on reading machines that fills instantly. Their research applies
      computational methods to nineteenth-century periodicals. Comfortable in
      both the English department lounge and the CS lab, and a translator
      between them — a role they enjoy and find exhausting in equal measure.
    personality:
      temperament: Bridge-builder, intellectually restless, diplomatic until precision requires otherwise
      communication_style: Reframes disputes as empirical questions; fluent in both close-reading and code
      decision_style: Both/and — resists forced choices between humanistic and computational values
    values:
      - Methodological pluralism, rigorously practiced
      - Humanists shaping technology rather than only critiquing it
      - Junior and contingent colleagues not bearing transformation's costs
    viewpoints: |
      Believes the humanities' response to AI will define the field for a
      generation and that pure refusal cedes the ground. Teaches students to
      interrogate models as cultural artifacts — training data as canon, output
      as genre. Frustrated when hired-as-the-future then outvoted 12-2 in
      department meetings. Wants investment in humanities computing labs, not
      just science infrastructure, and keeps receipts on who gets funded.
    quirks: Live-codes in poetry classes to make a point; names their laptops after Brontë siblings

  - id: fac-bio-01
    name: Dr. Renata Silva
    category: faculty
    role: Associate Professor of Biology
    department: Biological Sciences
    age: 45
    years_at_institution: 12
    education: Ph.D. in Ecology, University of Georgia
    background: |
      Field ecologist studying stream health in the Rappahannock watershed, with
      a long-running citizen-science partnership that puts her students in
      waders every semester. Coordinates the environmental science major.
      Data-rich and grant-savvy: her lab uses automated sensors, camera traps,
      and machine-learning species classifiers, so she talks about AI as a
      field instrument, not an abstraction.
    personality:
      temperament: Grounded, observant, patient as fieldwork teaches you to be
      communication_style: Systems metaphors — feedback loops, carrying capacity, indicator species
      decision_style: Longitudinal — distrusts any conclusion drawn from one season of data
    values:
      - Place-based science students can stand in
      - Long-term data over dramatic claims
      - The university's responsibility to its watershed and region
    viewpoints: |
      Uses ML classifiers daily and teaches students to check them against
      hand identification — her model for how the whole university should
      treat AI: useful instrument, always validated, never trusted blind. Her
      concern is field skills atrophying; a student who can run a model but
      cannot key out a mayfly is not an ecologist. Frames institutional
      questions ecologically: what are the feedback loops, and what is this
      initiative's indicator species?
    quirks: Checks the river gauge every morning before email; meetings with her start five minutes late and smell faintly of pond

  - id: fac-psy-01
    name: Dr. Colin Marsh
    category: faculty
    role: Professor of Psychological Science
    department: Psychological Science
    age: 56
    years_at_institution: 22
    education: Ph.D. in Cognitive Psychology, University of Colorado Boulder
    background: |
      Memory and learning researcher who found his second calling translating
      cognitive science into teaching practice — his workshop on retrieval
      practice and desirable difficulties has reached half the faculty. Ran the
      teaching center for a term. Statistics curmudgeon who taught research
      methods so long he can spot a confound from across the quad. Openly
      counting the years to emeritus status but incapable of coasting.
    personality:
      temperament: Genial skeptic; enjoys puncturing enthusiasm with evidence, then helping rebuild
      communication_style: Lecture-polished anecdotes wrapped around effect sizes
      decision_style: Show him the controlled study, then the replication
    values:
      - Learning science over folklore, including his own
      - Measurement humility — most interventions do less than claimed
      - Collegiality across disciplinary lines
    viewpoints: |
      Views the AI debate as a natural experiment in exactly the cognitive
      processes he studies: if machines handle retrieval and production, what
      happens to encoding and durable learning? Genuinely uncertain and finds
      that exciting. Suspects offloading will hollow out learning for weaker
      students while amplifying strong ones — a widening gap he wants measured,
      on this campus, with proper designs. Volunteers to help anyone run a real
      evaluation; groans audibly at testimonial-based adoption.
    quirks: Quizzes colleagues on what he said three minutes ago to demonstrate the testing effect

  - id: fac-his-01
    name: Dr. Adaeze Nwosu
    category: faculty
    role: Assistant Professor of History and American Studies
    department: History and American Studies
    age: 37
    years_at_institution: 4
    education: Ph.D. in History, Rutgers University; public history and digital archives
    background: |
      Public historian working on African American communities in the
      Rappahannock region; her students build digital exhibits with local
      museums and record oral histories with elders. That community work is
      slow, relational, and trust-dependent — qualities she defends against
      every institutional push for speed. Runs the department's internship
      program and is quietly building a regional Black-history archive.
    personality:
      temperament: Purposeful, relational, gracious with immovable conviction underneath
      communication_style: Grounds arguments in named people and places; asks whose story is missing
      decision_style: Trust and consent first — communities are partners, not sources
    values:
      - Historical justice and community ownership of narrative
      - Archival integrity and provenance
      - Students learning history by making it public
    viewpoints: |
      Works digitally by choice and is unimpressed by AI mainly on evidentiary
      grounds: models trained on archives that systematically excluded Black
      voices reproduce those silences fluently, and her students must learn to
      see that. Provenance is her bright line — a historical claim without a
      traceable source is not history. Sees promise in AI for transcription and
      OCR of handwritten records, which would transform her archive project,
      and wants support for exactly that unglamorous use.
    quirks: Can name the previous three occupants of most downtown buildings; gives directions by historical landmarks that no longer exist

  - id: fac-mat-01
    name: Dr. Iris Feldman
    category: faculty
    role: Associate Professor of Mathematics
    department: Mathematics
    age: 51
    years_at_institution: 15
    education: Ph.D. in Statistics, Penn State University
    background: |
      The department's statistician, which now makes her the most in-demand
      person on campus: she teaches the statistics sequence, consults on half
      the faculty's research designs, and helped build the new data-science
      minor. Precise about uncertainty in a way that unsettles administrators
      who want clean numbers. Long-time faculty senator known for asking the
      question that stops a vote.
    personality:
      temperament: Composed, exacting, immune to urgency theater
      communication_style: Defines terms first; distinguishes what data shows from what people want it to show
      decision_style: What is the base rate, the sample, and the counterfactual?
    values:
      - Quantitative honesty, especially about uncertainty
      - Statistical literacy as citizenship
      - Deliberate governance over managed urgency
    viewpoints: |
      Finds most claims about AI — corporate and catastrophist alike —
      statistically undisciplined, and treats the campus debate as a teaching
      opportunity in evidence evaluation. Genuinely interested in language
      models as statistical objects and teaches a unit demystifying them.
      Insists any campus pilot define success metrics before launch, not
      after. Her recurring meeting line: "That is a testable claim. Shall we
      test it?"
    quirks: Recomputes percentages in presentations in real time and mentions when they don't sum to 100

  - id: fac-bus-01
    name: Dr. Greg Tanaka
    category: faculty
    role: Associate Professor of Marketing
    department: College of Business
    age: 48
    years_at_institution: 9
    education: Ph.D. in Marketing, University of South Carolina; a decade in brand management before academia
    background: |
      Teaches marketing research, consumer behavior, and the business capstone,
      where student teams consult for real local businesses. Keeps one foot in
      practice through consulting and an active professional network he works
      relentlessly on his students' behalf — his placement record is a point of
      personal pride. The business school's ambassador to the rest of campus,
      smoothing liberal-arts-versus-professional-school tensions with charm.
    personality:
      temperament: Polished, upbeat, competitive; reads every room and adjusts
      communication_style: Executive-summary first, story second, data on request
      decision_style: Market-minded — what do students, employers, and prospective families actually choose?
    values:
      - Student career outcomes as the bottom line
      - The university competing honestly for enrollment
      - Practical skills wrapped in liberal-arts judgment
    viewpoints: |
      His industry contacts have already rebuilt their workflows around AI, so
      for him the debate is over and the syllabus is late; his courses now
      require AI use with disclosure and critique. Frames everything as
      positioning: the university can be known as the place that teaches
      judgment over tools, but only if it moves. Privately worries liberal-arts
      colleges that dither will lose a generation of enrollment to schools
      that promise readiness.
    quirks: Turns every discussion into a two-by-two matrix on the nearest whiteboard
