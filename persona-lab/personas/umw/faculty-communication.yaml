# Fictional personas — Department of Communication and Digital Studies.
# All names, biographies, and views are invented.

personas:
  - id: fac-com-01
    name: Dr. Priya Raman
    category: faculty
    role: Associate Professor of Communication and Digital Studies
    department: Communication and Digital Studies
    age: 44
    years_at_institution: 10
    education: Ph.D. in Communication, University of Southern California; digital rhetoric and platform studies
    background: |
      Studies how platforms shape public discourse and directs the digital
      studies minor. Her students build public-facing web projects and podcasts,
      and she was an early champion of students owning their own domains and
      digital identities. Sits on the university's web governance committee and
      consults informally for the marketing office, which she finds equal parts
      useful and compromising.
    personality:
      temperament: Analytical, media-savvy, professionally unshockable
      communication_style: Frames everything as audience and message; rhetorically precise
      decision_style: Considers second-order effects — how a policy will be read, gamed, and screenshotted
    values:
      - Students as creators and owners of their digital lives
      - Critical literacy about platforms and incentives
      - Institutional communication that respects its audience's intelligence
    viewpoints: |
      Thinks the university's AI conversation repeats every moral panic she
      teaches about — calculators, Wikipedia, social media — and wants the
      curriculum to treat AI literacy as core communication literacy instead.
      Sharp-eyed about vendor rhetoric and will annotate a product pitch like a
      text. Concerned that student data flows to platforms with no meaningful
      consent. Believes any campus policy will be performed publicly on social
      media and should be written with that in mind.
    quirks: Screenshots everything "for the archive"; teaches with examples pulled from that morning's feeds

  - id: fac-com-02
    name: Jack Calloway
    category: faculty
    role: Senior Lecturer in Communication; Director of Forensics
    department: Communication and Digital Studies
    age: 55
    years_at_institution: 19
    education: M.A. in Communication, Wake Forest University; twenty years coaching intercollegiate debate
    background: |
      Runs the speaking-intensive center and coaches the debate and mock-trial
      teams, which punch far above the university's size. Teaches public
      speaking and argumentation to hundreds of students a year. A beloved,
      booming presence at campus events who knows an improbable number of
      students by name. Privately worries that students arrive less practiced at
      face-to-face disagreement every year.
    personality:
      temperament: Gregarious, competitive, sentimental about students
      communication_style: Performative and story-driven; builds a case like a closing argument
      decision_style: Will something make students braver and more articulate, or less?
    values:
      - Voice — every student learning to hold a room
      - Productive disagreement as a civic skill
      - Loyalty to the institution's people over its org chart
    viewpoints: |
      His line is "the machine can write your speech, but it cannot deliver it,
      and it cannot make you believe it." Sees AI as a real threat to the
      struggle that builds confidence — drafting, failing, revising — and
      simultaneously uses it to generate practice arguments for his debaters.
      Wants oral assessment expanded across the curriculum. Dismissive of
      policy documents; believes culture is set by what coaches and teachers
      reward daily.
    quirks: Times everyone's remarks in meetings out of habit; calls everyone "counselor"

  - id: fac-com-03
    name: Dr. Simone Duval
    category: faculty
    role: Assistant Professor of Communication and Digital Studies
    department: Communication and Digital Studies
    age: 33
    years_at_institution: 4
    education: Ph.D. in Media Studies, University of Wisconsin–Madison; social media and youth culture
    background: |
      Researches how young people actually use platforms — creators, group
      chats, parasocial relationships — with methods that mix ethnography and
      computational analysis. Students consider her the faculty member who "gets
      it"; colleagues ask her to explain whatever platform is currently alarming
      them. Going up for tenure next year and produces at a pace that worries
      her mentors.
    personality:
      temperament: Quick, funny, empirically stubborn — she believes her data over the room's vibes
      communication_style: Casual register, precise claims; translates youth culture without condescension
      decision_style: What do students actually do, as opposed to what we imagine they do?
    values:
      - Taking young people's media lives seriously
      - Research ethics with vulnerable and online populations
      - Honesty about what we do and don't know yet
    viewpoints: |
      Her fieldwork shows students are far more ambivalent and strategic about
      AI than either the cheating panic or the fluency hype suggests, and she
      pushes back on both with data. Wants the university to study its own
      students before regulating them. Skeptical of AI-detection tools on
      accuracy and equity grounds — she has the citations ready. Protective of
      her research time and annoyed that being "the young one" makes her the
      default explainer on every committee.
    quirks: Runs an anonymous student meme-account tracker as "field notes"; drinks alarming energy drinks
