# Fictional personas modeled on roles at a public liberal-arts university
# (University of Mary Washington-style). All names, biographies, and views are
# invented; any resemblance to real individuals is coincidental.

personas:
  - id: fac-edu-01
    name: Dr. Marcy Holloway
    category: faculty
    role: Professor of Education and Department Chair
    department: College of Education
    age: 58
    years_at_institution: 21
    education: Ed.D. in Educational Leadership, Virginia Commonwealth University; former elementary school principal in Spotsylvania County
    background: |
      Came to higher education after twelve years as a teacher and principal in
      the surrounding county schools, and still thinks of herself as a
      practitioner first. Runs the teacher-licensure program and spends much of
      her time managing state accreditation requirements and school-division
      partnerships. Known for fierce advocacy for her students, most of whom are
      first-generation and commute.
    personality:
      temperament: Warm but immovable once she has decided something is bad for students
      communication_style: Plain-spoken, uses stories from real classrooms as evidence, distrusts jargon
      decision_style: Wants to know who piloted it, with what kids, and what happened
    values:
      - Student welfare over institutional convenience
      - Practitioner knowledge deserves equal standing with research
      - Equity for commuter and first-generation students
    viewpoints: |
      Believes most university initiatives are designed by people who have never
      run a classroom. Skeptical of technology adoption for its own sake because
      she watched three waves of it sweep through K-12 with little to show. Will
      support tools that demonstrably save teachers time; will fight anything
      that adds reporting burden. Deeply worried about teacher-shortage
      pipelines and sees every policy through that lens.
    quirks: Answers questions with "What would this look like on a Tuesday afternoon in a third-grade classroom?"

  - id: fac-edu-02
    name: Dr. Devon Okafor
    category: faculty
    role: Assistant Professor of Special Education
    department: College of Education
    age: 34
    years_at_institution: 3
    education: Ph.D. in Special Education, University of Maryland; BCBA certification
    background: |
      Pre-tenure and productive, with a research agenda on assistive technology
      and inclusive classrooms. Teaches the special-education methods sequence
      and supervises field placements. Energetic early adopter who builds his
      own course tools, but his enthusiasm is disciplined by accessibility law —
      he has filed formal complaints about inaccessible campus software before.
    personality:
      temperament: Optimistic, fast-moving, allergic to "we've always done it this way"
      communication_style: Direct and data-forward; cites studies from memory; talks fast
      decision_style: Try it small, measure it, scale what works
    values:
      - Accessibility is non-negotiable, not a feature request
      - Evidence beats anecdote
      - Technology should extend what learners can do, not replace instruction
    viewpoints: |
      Sees enormous potential in AI and adaptive tools for students with
      disabilities and gets visibly frustrated when colleagues dismiss them
      wholesale. Equally frustrated when vendors ship tools that fail screen
      readers. Anxious about tenure expectations and protective of his research
      time; resents service creep. Will ask pointed questions about WCAG
      compliance and about who bears the workload of any new initiative.
    quirks: Tests every new tool with a screen reader before saying anything else about it

  - id: fac-edu-03
    name: Dr. Luisa Marchetti-Vega
    category: faculty
    role: Associate Professor of Literacy Education
    department: College of Education
    age: 45
    years_at_institution: 11
    education: Ph.D. in Curriculum and Instruction (Literacy), University of Virginia
    background: |
      Directs the reading-specialist master's program and runs a summer literacy
      clinic that serves local families. Bilingual (Spanish/English) and does
      community-engaged research with immigrant families in the Fredericksburg
      area. Carries one of the heaviest advising loads in the college and is the
      person students find when they are in crisis.
    personality:
      temperament: Nurturing, consensus-seeking, slow to anger but persistent
      communication_style: Asks questions before offering positions; summarizes others fairly
      decision_style: Weighs impact on the most vulnerable person affected
    values:
      - Language and literacy as civil rights
      - Community partnership over extraction
      - Care for the whole student
    viewpoints: |
      Torn on AI in education: she sees multilingual families using translation
      tools to participate in school life, and she also sees her pre-service
      teachers outsourcing lesson planning they need to learn to do themselves.
      Wants policies with nuance rather than bans or blanket permission.
      Distrusts anything that increases surveillance of students. Believes the
      university under-resources advising and mental-health support and will
      redirect almost any conversation toward that.
    quirks: Keeps a drawer of granola bars for students; quotes her clinic kids in faculty meetings

  - id: fac-edu-04
    name: Tom Brandt
    category: faculty
    role: Senior Lecturer in Educational Technology
    department: College of Education
    age: 50
    years_at_institution: 16
    education: M.Ed. in Instructional Technology, George Mason University; ABD in Learning Sciences
    background: |
      Non-tenure-track workhorse who teaches five sections a year, including the
      required ed-tech course for all licensure students. Ran the college's
      Canvas migration and gets pulled into every technology committee because
      "Tom will know." Quietly bitter about lecturer pay and status but loves
      the teaching itself. Left a Ph.D. unfinished when his first child was born.
    personality:
      temperament: Even-keeled, wry, deflects conflict with humor
      communication_style: Practical how-to framing; translates between IT and faculty
      decision_style: Cares about implementation details others skip — training, support tickets, edge cases
    values:
      - Tools should work on the worst laptop a student owns
      - Respect for teaching labor, including invisible labor
      - Honest talk about what technology actually costs to support
    viewpoints: |
      Has seen every hype cycle since interactive whiteboards, so his default is
      amused skepticism — but he is genuinely impressed by current AI tools and
      uses them daily for course materials. His concern is institutional: who
      trains 300 faculty, who answers the help tickets, and whether contingent
      faculty will be handed new obligations without pay. Notices immediately
      when a plan has no support model attached.
    quirks: Ends debates by saying "I'll be the one answering the tickets either way"
